# Fontes do mundo (sem receita): terreno, plantas, mobs, loot e minérios que NÃO são do GregTech.
# Formato: chave = dimensão (minecraft:overworld, minecraft:the_nether, …) ou `qualquer` (vale em toda dimensão
# aberta); valor = lista de entradas, cada uma:
#   "<item>"              item que se pega direto no mundo
#   "#tag"                todos os itens da tag
#   "fluid:<id>"          fluido que se pega no mundo (fluid:#tag também vale)
#   {id: ..., needs: [itens, um basta], tier: 0..4}
#                         só conta com um dos itens de `needs` no fecho e/ou picareta de nível >= tier
#                         (0 madeira/ouro, 1 pedra, 2 ferro, 3 diamante, 4 netherite; nível do bloco = block_tiers)
# Os minérios do GregTech (inclusive ferro, ouro, cobre, carvão, diamante, redstone, lapis, esmeralda e quartzo,
# que o GT tira do worldgen vanilla) NÃO entram aqui: vêm dos veios do dump (gt_veins) com o nível de picareta dos
# blocos de minério (tools/closure.py). A dimensão só abre com a quest de progression.yaml (dimension_unlocks).
qualquer:
  - fluid:minecraft:water
  - irons_spellbooks:arcane_essence      # loot de estruturas e mobs do Iron's
  - irons_spellbooks:scroll              # loot
  # O Eco do Arauto (morte do chefe final, 40_ecos_final_boss.js) NÃO é natural: drop de chefe entra pela seed
  # (tasks de kill ancestrais). Só os itens de usar o Eco ficam aqui, travados por ele.
  - {id: ecos:selo_restaurado, needs: [ecos:eco_do_arauto]}   # usar o Eco do Arauto
  - {id: ecos:poder_absorvido, needs: [ecos:eco_do_arauto]}   # usar o Eco do Arauto agachado
  - {id: ars_nouveau:wilden_tribute, needs: [ars_nouveau:ritual_wilden_summon]}  # Quimera Wilden (tooltip do item: Ritual of Summon Wilden)

