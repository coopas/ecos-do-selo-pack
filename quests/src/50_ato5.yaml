       "Trínio: do processamento da naquadah enriquecida (centrífuga), também a 7200 K."],
     tasks: [{tag: forge:ingots/naquadah_alloy, count: 16}], rewards: [{coins: 6}]}
  - {slug: bobina_naquadah, title: "Bobinas de Naquadah", deps: [naquadah, iridio], desc: ["Um alto-forno a 7200 K.",
