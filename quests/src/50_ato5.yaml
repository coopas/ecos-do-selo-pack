     desc: ["A última confissão de Ilse Varrow.", "Leia antes de continuar."], tasks: [{checkmark: true}],
     rewards: [{page: 27}, {coins: 5}]}
  - {slug: platina, title: "Platina e Paládio", deps: [inicio], desc: ["Metais nobres para a ultimíssima voltagem.",
       "Veio de sheldonita no End (y 5 a 50), ou o Platinum Group Sludge na centrífuga com água-régia."],
     tasks: [{tag: forge:ingots/platinum, count: 16}, {tag: forge:ingots/palladium, count: 16}], rewards: [{coins: 5}]}
  - {slug: iridio, title: "Irídio e Ósmio", deps: [platina], desc: ["Os metais mais densos que a terra guarda.",
       "Saem da mistura de metais raros do Platinum Group Sludge (reator químico grande, 7680 EU/t).",
       "Os dois fundem a 4500 K; o ósmio pede alto-forno em LuV (30720 EU/t)."],
     tasks: [{tag: forge:ingots/iridium, count: 16}, {tag: forge:ingots/osmium, count: 16}], rewards: [{coins: 6}]}
