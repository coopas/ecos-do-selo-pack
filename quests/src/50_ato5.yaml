     tasks: [{item: ecos:fragmento_selo_estrelas}], rewards: [{coins: 6}]}
  - {slug: bloco_fonte, title: "Bloco de Fonte", deps: [inicio, side_ars/arquimago], desc: ["Mana condensada em pedra."],
