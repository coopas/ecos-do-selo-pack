  - {slug: gema_espiritos, title: "Gema dos Espíritos", deps: [inicio, side_occultism/mestre_ocultista], desc: ["Para que os espíritos ouçam o Artefato."],
     tasks: [{item: occultism:spirit_attuned_gem}], rewards: [{coins: 4}]}
  - {slug: quatro, title: "Os Quatro Fragmentos", deps: [floresta_de_novo, profundezas_de_novo, ceus_de_novo, estrelas_de_novo], shape: gear,
