       "Funde a 5000 K (bobinas de HSS-G) e sai quente."], tasks: [{tag: forge:ingots/naquadah, count: 16}],
     rewards: [{crate: epica}, {coins: 8}]}
  - {slug: liga_naquadah, title: "Liga de Naquadah", deps: [bobina_naquadah, osmiridio], desc: ["O metal dos cascos ZPM.",
