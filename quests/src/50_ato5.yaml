       "bobinas de trínio, feitas na montadora (assembler) ZPM."], tasks: [{item: gtceu:zpm_field_generator}],
     rewards: [{crate: lendaria}, {coins: 12}]}
  - {slug: campo_luv, legacy_id: ato4/campo_luv, title: "Gerador de Campo LuV", deps: [bobina_naquadah, montadora_luv],
