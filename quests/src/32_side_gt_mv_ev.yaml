     tasks: [{item: gtceu:kanthal_coil_block, count: 16}], rewards: [{coins: 4}]}
  - {slug: inox, title: "Aço Inoxidável", deps: [kanthal], shape: gear, icon: gtceu:stainless_steel_ingot,
     desc: ["Não enferruja. Nunca.", "Também 480 EU/t no alto-forno, com as duas escotilhas MV."], tasks: [{tag: forge:ingots/stainless_steel, count: 32}], rewards: [{crate: rara}, {coins: 5}]}
  - {slug: casco_hv, title: "Casco HV", deps: [inox, polietileno], desc: ["Alta voltagem."],
     tasks: [{item: gtceu:hv_machine_hull, count: 2}], rewards: [{coins: 4}]}
  - {slug: motor_hv, title: "Motor HV", deps: [casco_hv], desc: ["O motor da alta tensão."],
     tasks: [{item: gtceu:hv_electric_motor, count: 4}], rewards: [{coins: 4}]}
  - {slug: boule, title: "Monocristal de Silício", deps: [kanthal], desc: ["Um cristal só, puro, para cortar em lâminas."],
     tasks: [{item: gtceu:silicon_boule}], rewards: [{coins: 4}]}
  - {slug: placa_plastico, title: "Placa de Circuito de Plástico", deps: [polietileno], desc: ["A base dos circuitos avançados."],
     tasks: [{item: gtceu:plastic_printed_circuit_board, count: 8}], rewards: [{coins: 3}]}
  - {slug: montadora_circuito, title: "Montadora de Circuitos HV", deps: [escotilha, emissor_hv], desc: ["Monte circuitos sem errar uma solda.",
            "Pede dois circuitos EV: a estação de trabalho, montada dentro da sala limpa."],
     tasks: [{item: gtceu:hv_circuit_assembler}], rewards: [{coins: 5}]}
  - {slug: microprocessador, title: "Microprocessador", deps: [circuito_avancado, placa_plastico], desc: ["Um pensamento do tamanho de uma unha.",
            "Sai da montadora de circuitos MV, que leva dois circuitos HV."],
     tasks: [{item: gtceu:micro_processor, count: 8}], rewards: [{coins: 4}]}
  - {slug: circuito_avancado, title: "Circuito Integrado Avançado", deps: [boule, gravador], shape: gear,
     icon: gtceu:advanced_integrated_circuit, desc: ["O circuito da alta tensão.",
            "Sai da montadora de circuitos LV (ela leva dois circuitos MV), com chips ILC e RAM do gravador.",
            "O transistor pede placa de silício: o lingote sai do alto-forno a 2273 K, com bobinas de kanthal."],
     tasks: [{item: gtceu:advanced_integrated_circuit, count: 4}], rewards: [{crate: rara}, {coins: 6}]}
  - {slug: emissor_hv, title: "Emissor HV", deps: [circuito_avancado], desc: ["Uma luz mais forte."],
     tasks: [{item: gtceu:hv_emitter, count: 2}], rewards: [{coins: 4}]}
  - {slug: campo_hv, title: "Gerador de Campo HV", deps: [nicromo, reator_grande], desc: ["Um campo invisível, como o Selo.",
