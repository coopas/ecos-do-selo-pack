chapter: side_gt_mv_ev
title: "Caminho — Alta Tensão"
icon: "ecos:textures/gui/chapters/side_gt_mv_ev.png"
group: caminhos
act: 3
quests:
  - {slug: inicio, title: "Mais Voltagem", deps: [ato2/casco_mv], shape: gear, icon: gtceu:mv_machine_hull,
     desc: ["Uma voltagem nova, uma linha de máquinas nova."], tasks: [{checkmark: true}], rewards: [{coins: 2}]}
  - {slug: macerador_mv, title: "Macerador MV", deps: [inicio], desc: ["Mais subprodutos por minério."],
     tasks: [{item: gtceu:mv_macerator}], rewards: [{coins: 3}]}
  - {slug: lavadora, title: "Lavadora de Minério", deps: [inicio], desc: ["Água limpa o pó e revela o que estava escondido."],
     tasks: [{item: gtceu:mv_ore_washer}], rewards: [{coins: 3}]}
  - {slug: centrifuga_termica, title: "Centrífuga Térmica", deps: [lavadora], desc: ["Calor separa o que a água não separou."],
     tasks: [{item: gtceu:mv_thermal_centrifuge}], rewards: [{coins: 3}]}
  - {slug: banho, title: "Banho Químico", deps: [lavadora], desc: ["Mergulhe o minério em ácido."],
     tasks: [{item: gtceu:mv_chemical_bath}], rewards: [{coins: 3}]}
  - {slug: reator_mv, title: "Reator Químico MV", deps: [inicio], desc: ["Reações mais rápidas."],
     tasks: [{item: gtceu:mv_chemical_reactor}], rewards: [{coins: 3}]}
  - {slug: polietileno, title: "Polietileno", deps: [reator_mv], shape: gear, icon: gtceu:polyethylene_plate,
     desc: ["O primeiro plástico. Aurend embrulhava tudo nele."], tasks: [{tag: forge:plates/polyethylene, count: 16}],
     rewards: [{crate: comum}, {coins: 4}]}
  - {slug: pirolise, title: "Forno de Pirólise", deps: [inicio], desc: ["Madeira e carvão viram gases úteis."],
     tasks: [{item: gtceu:pyrolyse_oven}], rewards: [{coins: 4}]}
  - {slug: destilaria, title: "Torre de Destilação", deps: [sala_limpa], desc: ["Separe o petróleo em mil coisas.",
            "Pede quatro circuitos EV: a estação de trabalho, montada dentro da sala limpa."],
     tasks: [{item: gtceu:distillation_tower}], rewards: [{coins: 5}]}
  - {slug: craqueador, title: "Unidade de Craqueamento", deps: [destilaria], desc: ["Quebre moléculas grandes em pequenas."],
     tasks: [{item: gtceu:cracker}], rewards: [{coins: 4}]}
  - {slug: turbina_gas, title: "Turbina a Gás MV", deps: [pirolise], desc: ["Queime o gás de madeira (ou de carvão) que a pirólise solta."],
     tasks: [{item: gtceu:mv_gas_turbine}], rewards: [{coins: 3}]}
  - {slug: gravador, title: "Gravador a Laser", deps: [inicio], desc: ["Luz que escreve em cristal."],
     tasks: [{item: gtceu:mv_laser_engraver}], rewards: [{coins: 4}]}
  - {slug: kanthal, title: "Bobinas de Kanthal", deps: [banho], desc: ["Mais calor para o alto-forno.",
