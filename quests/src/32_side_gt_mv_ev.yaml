            "que o reator grande tira de plutônio e urânio do End."],
     tasks: [{item: gtceu:hv_field_generator}], rewards: [{coins: 5}]}
  - {slug: nicromo, title: "Bobinas de Nicromo", deps: [congelador, escotilha], desc: ["O calor que vem depois do titânio.",
            "O lingote pede 1920 EU/t (duas escotilhas HV no alto-forno) e sai quente: só o congelador a vácuo esfria."],
     tasks: [{item: gtceu:nichrome_coil_block, count: 16}], rewards: [{coins: 5}]}
  - {slug: multi_fornalha, title: "Multi-Fornalha", deps: [circuito_avancado], desc: ["Cozinhe em massa.", "Pede três circuitos HV."],
     tasks: [{item: gtceu:multi_smelter}], rewards: [{coins: 4}]}
  - {slug: congelador, title: "Congelador a Vácuo", deps: [sala_limpa], desc: ["Esfrie lingotes quentes demais para tocar.",
            "Pede três circuitos EV: a estação de trabalho, montada dentro da sala limpa."],
     tasks: [{item: gtceu:vacuum_freezer}], rewards: [{coins: 5}]}
  - {slug: sala_limpa, title: "Sala Limpa", deps: [motor_hv, microprocessador], desc: ["Circuitos finos não suportam poeira.",
            "Com a montadora MV dentro dela, a estação de trabalho (circuito EV) fica possível."],
     tasks: [{item: gtceu:cleanroom}], rewards: [{coins: 5}]}
  - {slug: reator_grande, title: "Reator Químico Grande", deps: [ptfe], desc: ["Química em escala industrial.", "Leva canos grandes de PTFE e quatro circuitos HV."],
     tasks: [{item: gtceu:large_chemical_reactor}], rewards: [{coins: 5}]}
  - {slug: pvc, title: "PVC", deps: [reator_grande], desc: ["Um plástico mais resistente."],
     tasks: [{item: gtceu:polyvinyl_chloride_plate, count: 16}], rewards: [{coins: 3}]}
  - {slug: ptfe, title: "PTFE", deps: [sala_limpa], desc: ["Nada gruda nele.",
            "O tetrafluoretileno (clorofórmio e ácido fluorídrico) pede 240 EU/t: um reator químico HV."],
     tasks: [{item: gtceu:polytetrafluoroethylene_plate, count: 16}], rewards: [{coins: 4}]}
  - {slug: implosao, title: "Compressor de Implosão", deps: [circuito_avancado], desc: ["Pressione até virar gema.", "Pede três circuitos HV."],
     tasks: [{item: gtceu:implosion_compressor}], rewards: [{coins: 4}]}
  - {slug: turbina_hv, title: "Turbina a Gás HV", deps: [turbina_gas, sala_limpa], desc: ["Mais gás, mais corrente."],
     tasks: [{item: gtceu:hv_gas_turbine}], rewards: [{coins: 4}]}
  - {slug: bateria_hv, title: "Buffer de Baterias HV", deps: [casco_hv], desc: ["Guarde a alta tensão."],
     tasks: [{item: gtceu:hv_battery_buffer_4x}], rewards: [{coins: 3}]}
  - {slug: escotilha, title: "Escotilha de Energia HV", deps: [sala_limpa], desc: ["Alimente multiblocos em alta tensão.",
            "Montada a 480 EU/t (montadora HV), com chip LPIC cortado dentro da sala limpa e sódio-potássio."],
     tasks: [{item: gtceu:hv_energy_input_hatch, count: 2}], rewards: [{coins: 3}]}
  - {slug: mineradora, title: "Mineradora HV", deps: [sala_limpa], desc: ["Uma máquina que cava por você."],
     tasks: [{item: gtceu:hv_miner}], rewards: [{coins: 4}]}
  - {slug: titanio, title: "Titânio", deps: [congelador], shape: gear, icon: gtceu:titanium_ingot,
     desc: ["O metal das naves. Aurend olhava para cima.", "O kanthal já aquece o bastante; o lingote sai quente e só o congelador a vácuo esfria."], tasks: [{tag: forge:ingots/titanium, count: 32}],
     rewards: [{crate: epica}, {coins: 8}]}
  - {slug: casco_ev, title: "Casco EV", deps: [titanio], desc: ["Extrema voltagem."],
     tasks: [{item: gtceu:ev_machine_hull, count: 2}], rewards: [{coins: 5}]}
  - {slug: motor_ev, title: "Motor EV", deps: [casco_ev], desc: ["Rápido como um pensamento."],
     tasks: [{item: gtceu:ev_electric_motor, count: 4}], rewards: [{coins: 5}]}
  - {slug: nano, title: "Nanoprocessador", deps: [montadora_circuito, reator_grande], desc: ["Circuitos que só se veem no microscópio.",
            "A lâmina nano pede 1920 EU/t no reator grande (duas escotilhas HV), dentro da sala limpa."],
     tasks: [{item: gtceu:nano_processor, count: 4}], rewards: [{coins: 6}]}
  - {slug: emissor_ev, title: "Emissor EV", deps: [motor_ev, nano], desc: ["Também é parte da Bancada da NASA."],
     tasks: [{item: gtceu:ev_emitter, count: 2}], rewards: [{coins: 5}]}
  - {slug: braco_ev, title: "Braço Robótico EV", deps: [motor_ev, nano], desc: ["Uma mão que monta foguetes."],
     tasks: [{item: gtceu:ev_robot_arm, count: 2}], rewards: [{coins: 5}]}
  - {slug: era_ev, title: "A Era da Extrema Tensão", deps: [emissor_ev, braco_ev, campo_hv], shape: gear, icon: gtceu:ev_machine_hull,
     desc: ["As máquinas de Aurend nunca chegaram tão longe.", "Ou chegaram, e foram embora."], tasks: [{checkmark: true}],
     rewards: [{crate: epica}, {coins: 8}, {xp_levels: 3}]}
