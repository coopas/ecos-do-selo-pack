chapter: side_create
title: "Caminho — Engrenagens de Aurend"
icon: create:cogwheel
group: caminhos
act: 1
quests:
  - {slug: liga, title: "Liga de Andesito", deps: [prologo/ferro], icon: create:andesite_alloy, shape: gear,
     desc: ["Andesito e ferro: a liga que movia Aurend."], tasks: [{item: create:andesite_alloy, count: 16}], rewards: [{coins: 2}]}
  - {slug: eixo, title: "Eixo", deps: [liga], desc: ["Toda força começa girando."], tasks: [{item: create:shaft, count: 8}], rewards: [{coins: 1}]}
  - {slug: engrenagem, title: "A Primeira Engrenagem", deps: [eixo], desc: ["Engrenagens transmitem o giro. E o silêncio."],
     tasks: [{item: create:cogwheel, count: 8}], rewards: [{page: 6}, {coins: 2}]}
  - {slug: engrenagem_grande, title: "Engrenagem Grande", deps: [engrenagem], desc: ["Grande e pequena trocam velocidade por força."],
     tasks: [{item: create:large_cogwheel, count: 2}], rewards: [{coins: 1}]}
  - {slug: roda_agua, title: "Roda de Água", deps: [engrenagem], desc: ["Água corrente, força constante."],
     tasks: [{item: create:water_wheel, count: 2}], rewards: [{coins: 2}]}
  - {slug: moinho_vento, title: "Moinho de Vento", deps: [engrenagem_grande], desc: ["Rolamento de moinho e velas: o vento também trabalha."],
     tasks: [{item: create:windmill_bearing}, {item: create:white_sail, count: 8}], rewards: [{coins: 3}]}
  - {slug: oculos, title: "Óculos do Engenheiro", deps: [engrenagem], desc: ["Veja estresse e rotação com os óculos."],
     tasks: [{item: create:goggles}], rewards: [{coins: 1}]}
  - {slug: chave_inglesa, title: "Chave Inglesa", deps: [engrenagem], desc: ["Gire, desmonte, ajuste."],
     tasks: [{item: create:wrench}], rewards: [{coins: 1}]}
  - {slug: caixa_engrenagens, title: "Caixa de Engrenagens", deps: [engrenagem_grande], desc: ["Mude a direção do giro."],
     tasks: [{item: create:gearbox}], rewards: [{coins: 1}]}
  - {slug: esteira, title: "Esteira", deps: [eixo], desc: ["Esteiras levam itens sem mãos."],
     tasks: [{item: create:belt_connector, count: 4}], rewards: [{coins: 2}]}
  - {slug: mo, title: "Mó", deps: [roda_agua], desc: ["Moer é o primeiro passo para multiplicar minério."],
     tasks: [{item: create:millstone}], rewards: [{coins: 2}]}
  - {slug: prensa, title: "Prensa Mecânica", deps: [roda_agua, caixa_engrenagens], desc: ["Prense lingotes em chapas."],
     tasks: [{item: create:mechanical_press}], rewards: [{coins: 3}]}
  - {slug: chapa_ferro, title: "Chapas de Ferro", deps: [prensa], desc: ["Chapas. O esqueleto de qualquer máquina."],
     tasks: [{item: create:iron_sheet, count: 16}], rewards: [{coins: 2}]}
  - {slug: misturador, title: "Misturador e Bacia", deps: [prensa], desc: ["Misture o que não se mistura."],
     tasks: [{item: create:mechanical_mixer}, {item: create:basin}], rewards: [{coins: 3}]}
  - {slug: ventilador, title: "Ventilador Encapsulado", deps: [caixa_engrenagens], desc: ["Vento sobre água lava; sobre fogo, cozinha."],
     tasks: [{item: create:encased_fan}], rewards: [{coins: 2}]}
  - {slug: deposito, title: "Depósito", deps: [esteira], desc: ["Um lugar para as máquinas trabalharem."],
     tasks: [{item: create:depot, count: 2}], rewards: [{coins: 1}]}
  - {slug: funil, title: "Funil e Calha", deps: [esteira], desc: ["Pegue e solte itens nas esteiras."],
     tasks: [{item: create:andesite_funnel, count: 4}, {item: create:chute, count: 4}], rewards: [{coins: 2}]}
  - {slug: furadeira, title: "Furadeira Mecânica", deps: [chapa_ferro], desc: ["Pedra para sempre, sem picareta."],
     tasks: [{item: create:mechanical_drill}], rewards: [{coins: 2}]}
  - {slug: serra, title: "Serra Mecânica", deps: [chapa_ferro], desc: ["Corte troncos em tábuas, sem fim."],
     tasks: [{item: create:mechanical_saw}], rewards: [{coins: 2}]}
  - {slug: zinco, title: "Zinco", deps: [prologo/picareta_ferro], desc: ["Um metal que Aurend usava no lugar do ouro."],
     tasks: [{tag: forge:ingots/zinc, count: 16}], rewards: [{coins: 2}]}
  - {slug: queimador, title: "Queimador de Blaze", deps: [misturador],
     desc: ["Capture um blaze com o Queimador Vazio.", "Fogo vivo aquece a bacia."],
     tasks: [{item: create:empty_blaze_burner}, {item: create:blaze_burner}], rewards: [{coins: 4}]}
  - {slug: latao, title: "Latão", deps: [zinco, misturador], icon: create:brass_ingot,
     desc: ["Cobre e zinco, misturados com calor."], tasks: [{tag: forge:ingots/brass, count: 16}], rewards: [{coins: 3}]}
  - {slug: involucro_latao, title: "Invólucro de Latão", deps: [latao], desc: ["O revestimento das máquinas finas."],
     tasks: [{item: create:brass_casing, count: 8}], rewards: [{coins: 2}]}
  - {slug: valvula, title: "Válvula Eletrônica", deps: [latao], desc: ["Uma pequena luz que controla grandes máquinas."],
     tasks: [{item: create:electron_tube, count: 8}], rewards: [{coins: 2}]}
  - {slug: aplicador, title: "Aplicador Mecânico", deps: [valvula], desc: ["Uma mão que nunca cansa."],
     tasks: [{item: create:deployer}], rewards: [{coins: 3}]}
  - {slug: mecanismo, title: "Mecanismo de Precisão", deps: [aplicador, involucro_latao], shape: gear, icon: create:precision_mechanism,
     desc: ["A montagem em sequência: prensa, aplicador e paciência.", "Sem ele, a floresta não se abre."],
     tasks: [{item: create:precision_mechanism, count: 2}], rewards: [{crate: rara}, {coins: 5}]}
  - {slug: montador, title: "Montador Mecânico", deps: [valvula, involucro_latao], desc: ["Receitas grandes demais para uma bancada."],
     tasks: [{item: create:mechanical_crafter, count: 9}], rewards: [{coins: 3}]}
  - {slug: rodas_trituradoras, title: "Rodas Trituradoras", deps: [montador], desc: ["Minério vira pó, pó vira lingote em dobro."],
     tasks: [{item: create:crushing_wheel, count: 2}], rewards: [{coins: 4}]}
  - {slug: braco, title: "Braço Mecânico", deps: [mecanismo], desc: ["Ele escolhe sozinho de onde pegar e onde soltar."],
     tasks: [{item: create:mechanical_arm}], rewards: [{coins: 3}]}
  - {slug: fluidos, title: "Canos, Bomba e Tanque", deps: [chapa_ferro], desc: ["Líquidos também se movem por engrenagens."],
     tasks: [{item: create:fluid_pipe, count: 16}, {item: create:mechanical_pump}, {item: create:fluid_tank, count: 4}], rewards: [{coins: 3}]}
  - {slug: motor_vapor, title: "Motor a Vapor", deps: [fluidos, queimador], desc: ["Vapor de Aurend, de novo girando o mundo."],
     tasks: [{item: create:steam_engine, count: 3}], rewards: [{crate: comum}, {coins: 4}]}
  - {slug: medidores, title: "Medir Antes de Quebrar", deps: [oculos], desc: ["Velocímetro e medidor de estresse."],
     tasks: [{item: create:speedometer}, {item: create:stressometer}], rewards: [{coins: 2}]}
  - {slug: esquemas, title: "Construções Lembradas", deps: [mecanismo],
     desc: ["Mesa e canhão de esquemas imprimem construções (.nbt).", "Coloque esquemas em schematics/. A Litematica (M) projeta."],
     tasks: [{item: create:schematic_table}, {item: create:schematicannon}, {item: create:empty_schematic, count: 4}], rewards: [{coins: 4}]}
  - {slug: trilhos, title: "Trilhos de Aurend", deps: [motor_vapor], shape: gear, desc: ["Os trens de Aurend voltam a correr."],
     tasks: [{item: create:track, count: 64}, {item: create:track_station}], rewards: [{crate: rara}, {coins: 5}]}
