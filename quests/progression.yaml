# Lido do jar (gtceu-1.20.1-7.5.3, SimpleSteamMachine.recipeModifier): a máquina a vapor recusa receita com
# RecipeHelper.getRecipeEUtTier(recipe) > LV (1); LP e HP só mudam a duração (LP x2). Logo o teto é V[LV] = 32.
steam_max_eut: {lp: 32, hp: 32}

