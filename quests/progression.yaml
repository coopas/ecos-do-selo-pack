# Dados de progressão para o motor de fecho (tools/closure.py) e o verificador de quests.
# As fontes do mundo ficam em naturals.yaml; os minérios do GregTech vêm dos veios do dump (gt_veins).

# Dimensão -> quest ("capitulo/slug") que a libera. O Overworld está sempre aberto.
# Regra: a quest de visitar a dimensão (task `dimension:`) — quem depende dela já esteve lá. Aether e Blue Skies
# exigem a Chave Celeste no inventário (pack/kubejs/ecos/travel.json), então abrem pela quest da chave.
# O End não tem quest nem trava: abre junto com o Nether (olhos do fim = pérola + pó de blaze).
# As órbitas abrem com o planeta (o foguete passa por elas). Pocket dimension e spatial storage não têm fontes.
dimension_unlocks:
  minecraft:the_nether: ato1/nether
  minecraft:the_end: ato1/nether
  twilightforest:twilight_forest: ato1/twilight
  undergarden:undergarden: ato2/undergarden
  deeperdarker:otherside: ato2/otherside
  aether:the_aether: ato3/chave
  blue_skies:everbright: ato3/chave
  blue_skies:everdawn: ato3/chave
  ad_astra:earth_orbit: side_space/orbita
  ad_astra:moon: side_space/lua
  ad_astra:moon_orbit: side_space/lua
  ad_astra:mars: side_space/marte
  ad_astra:mars_orbit: side_space/marte
  ad_astra:venus: side_space/venus
  ad_astra:venus_orbit: side_space/venus
  ad_astra:mercury: side_space/mercurio
  ad_astra:mercury_orbit: side_space/mercurio
  ad_astra:glacio: side_space/glacio
  ad_astra:glacio_orbit: side_space/glacio

